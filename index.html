<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Engineering Feed</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0E1320;--card:#161E31;--line:#2C3957;--chip:#1B2438;--tx:#EEF2FA;--mute:#9AA7C0;--amber:#FFB547;--teal:#3DD6C3;--bad:#FF8A7A}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Space Grotesk',system-ui,sans-serif;max-width:480px;margin:0 auto;position:relative;overflow:hidden}
button,input{font:inherit;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#auth{padding:max(56px,env(safe-area-inset-top)) 24px 24px;display:flex;flex-direction:column;gap:12px;height:100%;overflow:auto}
#auth h1{font-size:30px;margin:0 0 4px}#auth p{color:var(--mute);margin:0 0 12px}
input{background:var(--chip);border:1px solid var(--line);border-radius:14px;min-height:48px;padding:0 14px;width:100%}
.btn{min-height:48px;border-radius:24px;border:0;background:var(--amber);color:#1A1203;font-weight:700;cursor:pointer}
.btn.alt{background:var(--chip);color:var(--tx);border:1px solid var(--line)}
#msg{min-height:20px;font-size:14px;color:var(--bad)}
#app{height:100%;display:none}
header{position:absolute;top:0;left:0;right:0;height:92px;padding:max(48px,env(safe-area-inset-top)) 20px 0;display:flex;justify-content:space-between;align-items:center}
header b{font-size:22px}.pill{background:var(--chip);border-radius:20px;padding:8px 14px;font-size:14px;color:var(--amber);font-weight:700}
main{position:absolute;top:92px;bottom:72px;left:0;right:0;overflow-y:auto}
#feed{scroll-snap-type:y mandatory;scrollbar-width:none}#feed::-webkit-scrollbar{display:none}
section.post{height:100%;scroll-snap-align:start;padding:0 20px 12px}
.card{height:100%;background:var(--card);border-radius:20px;padding:18px;display:flex;flex-direction:column}
.tag{font-size:13px;color:var(--teal);font-weight:700}.sim{flex:1;display:flex;align-items:center}
.q{font-size:21px;font-weight:700;line-height:1.25;margin:6px 0 14px}
.opt{display:block;width:100%;min-height:48px;margin-bottom:10px;border-radius:14px;border:1px solid var(--line);background:var(--chip);text-align:left;padding:0 16px;cursor:pointer}
.opt.right{border-color:var(--teal);background:#12342f}.opt.wrong{border-color:var(--bad)}
.why{font-size:14px;color:var(--mute);min-height:40px}
.pane{display:none;padding:0 20px}.pane.on{display:block}
.row{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:8px;height:200px;margin:12px 0}
.pod div{flex:1;background:var(--chip);border-radius:12px 12px 0 0;text-align:center;padding-top:10px;font-size:14px}
nav{position:absolute;left:0;right:0;bottom:0;height:72px;background:#0A0E19;border-top:1px solid #243049;display:flex;justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;min-width:56px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mute);font-size:11px;cursor:pointer}
nav button.on{color:var(--amber)}
</style></head><body>
<div id="auth">
<h1>Engineering Feed</h1><p>Scroll, guess, learn. Log in to keep your streak and rank.</p>
<input id="name" placeholder="Display name (sign up only)" autocomplete="nickname">
<input id="email" type="email" placeholder="Email" autocomplete="email">
<input id="pass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
<button class="btn" id="login">Log in</button><button class="btn alt" id="signup">Create account</button>
<button class="btn alt" id="guest">Continue as guest</button><div id="msg" role="alert"></div>
</div>
<div id="app">
<header><b>Engineering Feed</b><span class="pill" id="streak"></span></header>
<main id="feed" class="pane on" style="padding:0"></main>
<main id="courses" class="pane"><h2>Courses</h2><p style="color:var(--mute)">Uploading notes and homework to get problems for your classes is coming next.</p></main>
<main id="ranks" class="pane"><h2>Ranks</h2><div class="pod" id="pod"></div><div id="subj"></div></main>
<main id="profile" class="pane"><h2 id="who"></h2><div id="stats"></div><button class="btn alt" id="out" style="width:100%">Log out</button></main>
<nav id="tabs"></nav>
</div>
<script>
const SUPABASE_URL="",SUPABASE_ANON_KEY="";  // paste your project values here (see README)
const sb=(SUPABASE_URL&&SUPABASE_ANON_KEY)?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const $=id=>document.getElementById(id);
const ic=d=>`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const TABS=[["feed","Home",'<path d="M3 11L12 3l9 8M5 10v10h5v-6h4v6h5V10"/>'],["courses","Courses",'<path d="M6 3h12a1 1 0 011 1v16a1 1 0 01-1 1H6a2 2 0 01-2-2V5a2 2 0 012-2zM8 3v18M11 8h5"/>'],["ranks","Ranks",'<path d="M9 21V9h6v12M3 21v-8h6M15 21v-5h6M3 21h18"/>'],["profile","Profile",'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>']];
const S=(v,b)=>`<svg viewBox="0 0 320 ${v}" width="100%" role="img" aria-label="${b}">`;
const CARDS=[
{id:"truss",sub:"Statics",tag:"Statics: trusses",svg:S(130,"Truss bridge with a load at center")+'<g stroke="#7F8FB0" stroke-width="3" fill="none"><path d="M20 100H300M20 100L90 40H230L300 100M90 40L160 100L230 40"/></g><path d="M160 100V118" stroke="#FFB547" stroke-width="4"/><path d="M150 112L160 126L170 112Z" fill="#FFB547"/></svg>',q:"A load hangs at the center of this truss. Which member carries the most compression?",o:["Top chord","Diagonals","Bottom chord"],a:0,why:"The top chord is squeezed while the bottom chord is stretched, like the top and bottom of a bent beam."},
{id:"rocket",sub:"Dynamics",tag:"Dynamics: Newton's second law",svg:S(170,"Rocket with thrust and weight")+'<path d="M160 20C178 44 182 80 178 120H142C138 80 142 44 160 20Z" fill="#C9D3E8"/><path d="M160 124V160" stroke="#FFB547" stroke-width="5"/><path d="M250 60V100" stroke="#3DD6C3" stroke-width="4"/></svg>',q:"At liftoff, what must be true for the rocket to rise?",o:["Thrust equals weight","Thrust exceeds weight","Thrust is zero"],a:1,why:"Net force up gives acceleration up (F = ma). Equal thrust and weight would just hover."},
{id:"tower",sub:"Structures",tag:"Structures: resonance",svg:S(170,"Tower with a heavy ball near the top")+'<path d="M130 160L145 30H175L190 160Z" fill="none" stroke="#7F8FB0" stroke-width="3"/><path d="M160 44V66" stroke="#FFB547" stroke-width="3"/><circle cx="160" cy="80" r="14" fill="#FFB547"/></svg>',q:"A skyscraper hangs a huge steel ball near its top. What does it do?",o:["Looks impressive","Cancels sway from wind and quakes","Stores emergency water"],a:1,why:"It swings out of step with the building, absorbing energy so the tower sways less."},
{id:"gears",sub:"Machines",tag:"Machines: gear ratios",svg:S(150,"Small gear driving a large gear")+'<circle cx="105" cy="75" r="34" fill="none" stroke="#FFB547" stroke-width="8" stroke-dasharray="6 5"/><circle cx="195" cy="75" r="56" fill="none" stroke="#7F8FB0" stroke-width="8" stroke-dasharray="6 5"/></svg>',q:"A 10-tooth gear drives a 30-tooth gear. What happens to speed and torque?",o:["Slower, more torque","Faster, more torque","Slower, less torque"],a:0,why:"A 3:1 reduction cuts speed to a third and multiplies torque by about three (minus friction)."},
{id:"wind",sub:"Energy",tag:"Energy: fluid mechanics",svg:S(170,"Wind turbine")+'<path d="M160 80V165" stroke="#7F8FB0" stroke-width="5"/><g stroke="#C9D3E8" stroke-width="6" stroke-linecap="round"><path d="M160 80L160 20M160 80L212 110M160 80L108 110"/></g></svg>',q:"What's the most kinetic energy a wind turbine can pull from the wind?",o:["100%","About 59%","About 30%"],a:1,why:"The Betz limit: stop the air completely and it piles up and blocks the flow, so about 59.3% is the ceiling."}];
const TIERS=[[150,"Platinum"],[80,"Gold"],[30,"Silver"],[0,"Bronze"]];
const tier=p=>TIERS.find(t=>p>=t[0])[1];
let user=null,st={name:"Guest",points:0,streak:0,lastDay:null,subjects:{},answered:{}};
const day=(o=0)=>new Date(Date.now()-o*864e5).toISOString().slice(0,10);
const KEY="ef-guest";
async function load(){
  if(user){const{data}=await sb.from("progress").select("*").eq("user_id",user.id).maybeSingle();
    if(data)st={name:data.display_name,points:data.points,streak:data.streak,lastDay:data.last_day,subjects:data.subjects||{},answered:data.answered||{}};
    else st.name=user.user_metadata?.name||user.email.split("@")[0];}
  else{try{Object.assign(st,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}}
}
async function save(){
  if(user){await sb.from("progress").upsert({user_id:user.id,display_name:st.name,points:st.points,streak:st.streak,last_day:st.lastDay,subjects:st.subjects,answered:st.answered});}
  else{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
}
function paint(){
  const done=st.lastDay===day()||st.lastDay===day(1);
  $("streak").textContent=(done?st.streak:0)+" day streak · "+st.points+" pts";
}
function renderFeed(){
  $("feed").innerHTML=CARDS.map((c,i)=>`<section class="post"><div class="card"><div class="tag">${c.tag}</div><div class="sim">${c.svg}</div><div class="q">${c.q}</div>${c.o.map((t,j)=>`<button class="opt" data-c="${i}" data-o="${j}">${t}</button>`).join("")}<div class="why" id="why${i}"></div></div></section>`).join("");
  CARDS.forEach((c,i)=>{if(c.id in st.answered)mark(i,st.answered[c.id])});
}
function mark(i,ch){
  const c=CARDS[i];document.querySelectorAll(`[data-c="${i}"]`).forEach(b=>{const j=+b.dataset.o;b.disabled=true;b.classList.toggle("right",j===c.a);b.classList.toggle("wrong",j===ch&&j!==c.a)});
  $("why"+i).textContent=(ch===c.a?"Correct. ":"Not quite. ")+c.why;
}
$("feed").addEventListener("click",async e=>{
  const b=e.target.closest(".opt");if(!b||b.disabled)return;
  const i=+b.dataset.c,j=+b.dataset.o,c=CARDS[i];st.answered[c.id]=j;mark(i,j);
  if(j===c.a){st.points+=10;st.subjects[c.sub]=(st.subjects[c.sub]||0)+10}
  if(st.lastDay!==day()){st.streak=st.lastDay===day(1)?st.streak+1:1;st.lastDay=day()}
  paint();await save();
});
function show(id){
  document.querySelectorAll("main").forEach(m=>m.classList.toggle("on",m.id===id));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===id));
  if(id==="ranks")ranks();if(id==="profile")profile();
}
$("tabs").innerHTML=TABS.map(t=>`<button data-t="${t[0]}" aria-label="${t[1]}">${ic(t[2])}${t[1]}</button>`).join("");
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)show(b.dataset.t)});
async function ranks(){
  $("subj").innerHTML=CARDS.map(c=>c.sub).filter((v,i,a)=>a.indexOf(v)===i).map(s=>`<div class="row"><span>${s}</span><b>${tier(st.subjects[s]||0)} · ${st.subjects[s]||0} pts</b></div>`).join("");
  let top=[];if(sb&&user){const{data}=await sb.from("progress").select("display_name,points").order("points",{ascending:false}).limit(3);top=data||[]}
  if(!top.length){$("pod").innerHTML='<p style="color:var(--mute)">Log in to see the podium of top players.</p>';return}
  const h=[150,190,120],order=[1,0,2];
  $("pod").innerHTML=order.filter(k=>top[k]).map(k=>`<div style="height:${h[k]}px"><b>${k+1}</b><br>${top[k].display_name}<br>${top[k].points} pts</div>`).join("");
}
function profile(){$("who").textContent=st.name;$("stats").innerHTML=`<div class="row"><span>Points</span><b>${st.points}</b></div><div class="row"><span>Streak</span><b>${st.streak}</b></div><div class="row"><span>Account</span><b>${user?user.email:"Guest, saved on this device"}</b></div>`}
function start(){$("auth").style.display="none";$("app").style.display="block";paint();renderFeed();show("feed")}
async function enter(u){user=u;await load();start()}
const say=t=>$("msg").textContent=t;
$("guest").onclick=()=>{user=null;load().then(start)};
$("signup").onclick=async()=>{if(!sb)return say("Set up Supabase first (see README), or continue as guest.");
  const{data,error}=await sb.auth.signUp({email:$("email").value,password:$("pass").value,options:{data:{name:$("name").value||undefined}}});
  if(error)return say(error.message);if(!data.session)return say("Check your email to confirm, then log in.");enter(data.user)};
$("login").onclick=async()=>{if(!sb)return say("Set up Supabase first (see README), or continue as guest.");
  const{data,error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("pass").value});if(error)return say(error.message);enter(data.user)};
$("out").onclick=async()=>{if(sb)await sb.auth.signOut();location.reload()};
if(sb)sb.auth.getSession().then(({data})=>{if(data.session)enter(data.session.user)});
</script></body></html>
